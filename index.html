<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust Protocol: Criminal Legends</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Co-op prototype</p>
          <h1>Trust Protocol: Criminal Legends</h1>
        </div>

        <div class="hud-box">
          <span class="label">Trust</span>
          <div class="meter-wrap">
            <div id="trustFill" class="meter-fill"></div>
          </div>
          <strong id="trustValue">100%</strong>
        </div>
      </header>

      <main class="game-layout">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="540"></canvas>
        </div>

        <aside class="sidebar">
          <section class="panel">
            <h2>Mission</h2>
            <p id="missionText">Recover the 3 artifacts and unlock the cartel vault.</p>
          </section>

          <section class="panel">
            <h2>Controls</h2>
            <ul>
              <li><strong>Blackhujus:</strong> W A S D</li>
              <li><strong>Mr. PING:</strong> I J K L</li>
              <li><strong>Merhujus:</strong> Arrow keys</li>
              <li><strong>Phone:</strong> P</li>
              <li><strong>Boost:</strong> Space</li>
            </ul>
          </section>

          <section class="panel">
            <h2>Team</h2>
            <div id="teamList" class="team-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
